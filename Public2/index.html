// 2. Fetch API
    // The Fetch API provides a more modern and powerful way to make HTTP requests.
    // It's promise-based and much easier to use than XMLHttpRequest.
    
// get request
get.addEventListener('click', () => {
    fetch('http://localhost:8090/api/v1/todos')
    .then(response => {
        if(!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`)
        }
        return response.json();
    })
    .then(data => {
        console.log(data)
        list.innerHTML = ""
        data.forEach((element) => {
            let todo = document.createElement('div')
            let ttl = document.createElement('span')
            let contt = document.createElement('span')
            let ttlText = document.createTextNode(element.title)
            let conttText = document.createTextNode(element.content)
            ttl.appendChild(ttlText)
            contt.appendChild(conttText)
            todo.classList.add('todo')
            ttl.classList.add('title')
            contt.classList.add('content')
            todo.appendChild(ttl)
            todo.appendChild(contt)
            list.appendChild(todo)
        });
    })
    .catch(error => console.error('Error:', error))
})

// post requet
post.addEventListener('click', () => {
    const titleInput = document.getElementById('post-title');
    const contentInput = document.getElementById('post-content');
    const title = titleInput.value.trim();
    const content = contentInput.value.trim();

    if (title === "" || content === "") {
        alert("To create an item, you must fill the two inputs in center.")
    } else {
        console.log(title, content);
        fetch('http://localhost:8090/api/v1/todos', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({title: title, content: content})
        })
        .then(async res => {
            console.log(res);
            if (!res.ok) {
                const errorText = await res.text();
                throw new Error(errorText || 'Unknown error');
            }
            if (res.headers.get('Content-Length') === '0') {
                return {}; // Return an empty object if the response is empty
            }
            return res.json();
        })
        .then(data => {
            console.log(data);
            alert("Todo created successfully");
            get.click();
            titleInput.value = '';
            contentInput.value = '';
        })
        .catch(error => {
            console.error("Error creating todo:", error);
            alert("Error creating todo");
        });
    }
})

        let put = document.querySelector(".put");

        put.addEventListener('click', () => {
            const idInput = document.getElementById('put-id');
            const titleInput = document.getElementById('put-title');
            const contentInput = document.getElementById('put-content');
            const id = idInput.value.trim();
            const title = titleInput.value.trim();
            const content = contentInput.value.trim();

            if (id === "" || title === "" || content === "") {
                alert("To update an item, you must fill the three fields in below.")
            } else {
                console.log(id, title, content);
                fetch(`http://localhost:8090/api/v1/todos/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        title: title,
                        content: content,
                        userId: 0
                    }),
                    headers: { 
                        "Content-type": "application/json; charset=UTF-8" 
                    }
                })
                .then(async res => {
                    console.log(res);
                    if (!res.ok) {
                        const errorText = await res.text();
                        throw new Error(errorText || 'Unknown error');
                    }
                    if (res.headers.get('Content-Length') === '0') {
                        return {}; // Return an empty object if the response is empty
                    }
                    return res.json();
                })
                .then(data => {
                    console.log(data);
                    alert("Todo updated successfully");
                    get.click();
                    idInput.value = '';
                    titleInput.value = '';
                    contentInput.value = '';
                })
                .catch(error => {
                    console.error("Error updating todo:", error);
                    alert("Error updating todo");
                });
            }
        })
        

        let del = document.querySelector(".del");
        del.addEventListener('click', () => {
            const idInput = document.getElementById('del-id');
            const id = idInput.value.trim();

            if (id === "") {
                alert("To delete an item, you must fill ID field.")
            } else {
                console.log(id)
                fetch(`http://localhost:8090/api/v1/todos/${id}`, {
                    method: 'DELETE',
                    headers: { 
                        "Content-type": "application/json; charset=UTF-8" 
                    }
                })
                .then(async res => {
                    console.log(res);
                    if (!res.ok) {
                        const errorText = await res.text();
                        throw new Error(errorText || 'Unknown error');
                    }
                    if (res.headers.get('Content-Length') === '0') {
                        return {}; // Return an empty object if the response is empty
                    }
                    return res.json();
                })

                .then(data => {
                    console.log(data);
                    alert("Todo deleted successfully");
                    get.click();
                    idInput.value = '';
                })
                .catch(error => {

                    alert("Error deleting todo");
                });
            }
        })
